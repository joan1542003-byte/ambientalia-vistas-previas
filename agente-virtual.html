<!doctype html>
<html lang="es-CL" class="agente-maqueta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Asistente | Transporte Autorizado</title>
<meta name="description" content="Asistente de Transporte Autorizado: resuelve dudas sobre el retiro de residuos y la cotización.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/transporte/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/transporte/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site/site.css?v=20261022f">
<link rel="stylesheet" href="assets/site/agente.css?v=20261022f">
<link rel="stylesheet" href="assets/site/agente-chat.css?v=20261022f">
</head>
<body data-site="transporte">

<!-- Maqueta a pantalla completa: el sitio real se muestra detrás, sin cambios, y el agente va encima. Aquí «Ver en la
     página» también muestra las guías y las normas, porque todo el sitio vive en el marco de atrás. -->
<iframe class="agente-sitio" src="transporte-autorizado.html" title="Sitio de Transporte Autorizado" data-agente-sitio></iframe>

<!-- Agente informativo: burbuja abajo a la izquierda que abre una ventana pequeña. Con la dirección del asistente
     (servicio Laravel, aparte; la misma de las cotizaciones) responde assets/site/agente-chat.js: la del plugin en
     WordPress, data-agente-api o, solo en este computador, ?asistente=<dirección local>. Sin dirección responde la
     maqueta (assets/site/agente.js) en las vistas previas y, sobre WordPress, la ventana avisa que no está disponible.
     En local, ?agente=maqueta fuerza la maqueta. data-turnstile: la clave pública de Cloudflare Turnstile, si el
     asistente tiene la secreta (en WordPress la pone el plugin). data-agente-espera: segundos que se espera cada
     respuesta (90 si no está). -->
<button class="agente-burbuja" type="button" data-agente-abrir aria-haspopup="dialog" aria-controls="agente" aria-expanded="false" aria-label="Abrir el asistente">
  <svg class="agente-b-chat" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/><path d="M9 10.5h6M9 14h3.5"/></svg>
  <svg class="agente-b-x" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<div class="agente" id="agente" role="dialog" aria-labelledby="agente-titulo" data-agente data-agente-api="" data-turnstile="" hidden>
  <div class="agente-panel">
    <div class="agente-cab">
      <button class="agente-icono" type="button" data-agente-volver aria-label="Volver a las opciones" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <span class="agente-avatar" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/><path d="M9 10.5h6M9 14h3.5"/></svg></span>
      <div class="agente-quien">
        <h2 id="agente-titulo">Asistente <span class="agente-tag" hidden></span></h2>
        <p hidden></p>
      </div>
      <button class="agente-icono" type="button" data-agente-nuevo aria-label="Empezar una conversación nueva"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg></button>
      <button class="agente-icono" type="button" data-agente-cerrar aria-label="Cerrar el agente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="agente-charla" data-agente-charla role="log" aria-live="polite" aria-label="Conversación con el agente" tabindex="0"></div>
    <form class="agente-escribir" data-agente-form autocomplete="off">
      <label class="sr-only" for="agente-q">Escribe tu pregunta</label>
      <input id="agente-q" name="q" type="text" maxlength="240" enterkeyhint="send" placeholder="Escribe tu pregunta">
      <button type="submit" aria-label="Enviar la pregunta"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
    </form>
  </div>
</div>

<script src="assets/site/site.js?v=20261022f" defer></script>
<script src="assets/site/pickers.js?v=20261022f" defer></script>
<script src="assets/site/agente.js?v=20261022f" defer></script>
<script src="assets/site/agente-chat.js?v=20261022f" defer></script>
</body>
</html>
