# Trae las publicaciones recientes de la página de LinkedIn y actualiza assets/transporte/linkedin.json.
# No necesita configuración: lee la página pública de la empresa. Si además están los secretos de la API de LinkedIn
# (Settings → Secrets and variables → Actions), usa primero esa vía. Detalle en tools/linkedin.mjs y docs/linkedin.md.
name: Publicaciones de LinkedIn
on:
  schedule:
    - cron: '17 */6 * * *'   # cada 6 horas
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: linkedin
  cancel-in-progress: true
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer publicaciones
        env:
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          LINKEDIN_PAGE: ${{ vars.LINKEDIN_PAGE }}
        # A mano (Run workflow) termina con error si LinkedIn no dejó leer; en las pasadas programadas solo deja un aviso
        run: node tools/linkedin.mjs ${{ github.event_name == 'workflow_dispatch' && '--estricto' || '' }}
      - name: Guardar si hay cambios
        run: |
          if [ -n "$(git status --porcelain assets/transporte/linkedin.json assets/transporte/linkedin)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/transporte/linkedin.json assets/transporte/linkedin
            git commit -m "Publicaciones de LinkedIn actualizadas"
            git push
            # Los cambios hechos por Actions no siempre disparan la publicación de Pages: se pide explícitamente
            curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          else
            echo "Sin publicaciones nuevas"
          fi
